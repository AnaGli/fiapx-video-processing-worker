apiVersion: v1
kind: ConfigMap
metadata:
  name: video-processing-worker-config
data:
  APP_NAME: "FIAP X Video Processing Worker"
  APP_VERSION: "1.0.0"

  DB_HOST: "video-worker-db.video-infra.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "video_processing"

  # Infraestrutura compartilhada — vive no namespace video-infra,
  # gerenciada pelo repositório video-infra-k8s
  RABBITMQ_HOST: "rabbitmq.video-infra.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_INPUT_QUEUE: "video-processing"
  RABBITMQ_COMPLETED_QUEUE: "video-processing-completed"
  RABBITMQ_FAILED_QUEUE: "video-processing-failed"

  S3_ENDPOINT_URL: "http://localstack.video-infra.svc.cluster.local:4566"
  S3_REGION: "us-east-1"
  S3_BUCKET: "videos"
