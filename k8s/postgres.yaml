apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-worker-db
  labels:
    app: video-worker-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-worker-db
  template:
    metadata:
      labels:
        app: video-worker-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: video-processing-worker-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: video-processing-worker-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: video-processing-worker-secrets
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}   # dev local — trocar por PVC para persistência real
---
apiVersion: v1
kind: Service
metadata:
  name: video-worker-db
spec:
  selector:
    app: video-worker-db
  ports:
    - port: 5432
      targetPort: 5432
