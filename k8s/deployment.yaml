apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processing-worker
  labels:
    app: video-processing-worker
spec:
  replicas: 1

  selector:
    matchLabels:
      app: video-processing-worker

  template:
    metadata:
      labels:
        app: video-processing-worker

    spec:
      containers:
        - name: video-processing-worker
          image: fiapx-video-processing-worker:latest

          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: video-processing-worker-config

            - secretRef:
                name: video-processing-worker-secrets

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"