services:
  worker:
    build: .
    container_name: video_processing_worker
    env_file:
      - .env
    volumes:
      - .:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      alembic upgrade head &&
      python -m app.main
      "

  db:
    image: postgres:17
    container_name: video_worker_db
    environment:
      POSTGRES_DB: video_processing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - worker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d video_processing"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  worker_postgres_data: